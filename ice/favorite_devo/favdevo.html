<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
         <table>
         <tr>
          <th>Speaker</th>
          <th>Title</th>
          <th>Location</th>
          <th>Year</th>
         </tr>
         <!--Devotional Row 1-->
         <tr>
          <td>Jeffrey R. Holland</td>
          <td>
            <a href="https://speeches.byu.edu/talks/jeffrey-r-holland/cast-not-away-therefore-your-confidence/" target="_blank">Cast Not Away Therefore Your Confidence</a>
          </td>
          <td>BYU</td>
          <td>1999</td>
         </tr>
        <!--Devotional Row 2-->
         <tr>
          <td>Dieter F. Uchtdorf</td>
          <td>
            <a href="https://www.churchofjesuschrist.org/study/general-conference/2010/04/your-happily-ever-after?lang=eng" target="_blank">Your Happily Ever After</a>
          </td>
          <td>General Conference</td>
          <td>2010</td>
         </tr>
        <!--Devotional Row 3-->
         <tr>
          <td>Henry B. Eyring</td>
          <td>
            <a href="https://www.churchofjesuschrist.org/study/general-conference/2012/04/mountains-to-climb?lang=eng" target="_blank">Mountains to Climb</a>
            </td>
          <td>General Conference</td>
          <td>2012</td>
         </tr>
         </table>

         <form>
          <h2>Have a great Devotional?</h2>
          <div>
          <label>Speaker:</label>
          <input type="text">
          </div>
          <div>
          <label>Title:</label>
          <input type="text">
          </div>

          <div>
          <label>Location:</label>
          <input type="text">
          </div>

          <div>
          <label>Year:</label>
          <input type="text">
          </div>

          <button type="submit">Add Devotional!</button>
         </form>
      </div>
    </main>
  </div>
</body>
</html>
